name: Android - Build AAB (Capacitor)

# Se déclenche manuellement depuis l'onglet "Actions" de GitHub,
# ou automatiquement quand vous créez un tag de version (ex: v1.0.0)
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-android:
    name: Build du bundle .aab
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer Java (requis pour Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Installer les dépendances
        run: npm ci

      - name: Build de l'app web (Next.js export statique -> dossier "out")
        run: npm run build

      - name: Ajouter la plateforme Android (si absente)
        run: npx cap add android || true

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Restaurer le fichier de signature (keystore)
        # Le contenu du .jks doit être encodé en base64 et stocké dans les secrets GitHub :
        #   Settings > Secrets and variables > Actions > New repository secret
        #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/achridz-release-key.jks

      - name: Construire le bundle release (.aab)
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publier le fichier .aab comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: achridz-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
